# KlikUmroh: default HTTPS host of the shared aaPanel server (DEPLOY.md section 7.4).
# A travel's own domain (www.namatravel.com) reaches this server with Host: <that domain> through the travel's
# Cloudflare (SSL mode Full, port 443). No vhost has that server_name, so Nginx used the first port-443 vhost in
# alphabetical order (another site). This block takes every unknown host on 443 to Next.js, which resolves the
# travel from the host. Hosts that have their own vhost still match it by server_name first.
# Port 80 is not touched: Cloudflare in Full mode talks to the origin on 443.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    # Any certificate works: Cloudflare in Full mode accepts it. The KlikUmroh origin certificate is already here.
    ssl_certificate /www/server/panel/vhost/cert/klikumroh.id/origin.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/klikumroh.id/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /www/server/panel/vhost/nginx/klikumroh-cf-realip.inc;
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:13000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
