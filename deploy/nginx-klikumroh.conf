# KlikUmroh: web Next.js (klikumroh.id + subdomain travel) dan dashboard (app.klikumroh.id)
server {
    listen 80;
    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /www/server/panel/vhost/cert/klikumroh.id/origin.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/klikumroh.id/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    listen [::]:80;
    server_name klikumroh.id *.klikumroh.id;
    include /www/server/panel/vhost/nginx/klikumroh-cf-realip.inc;
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:13000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}

server {
    listen 80;
    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /www/server/panel/vhost/cert/klikumroh.id/origin.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/klikumroh.id/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    listen [::]:80;
    server_name app.klikumroh.id;
    include /www/server/panel/vhost/nginx/klikumroh-cf-realip.inc;
    client_max_body_size 25m;
    root /www/wwwroot/klikumroh/dashboard/dist;

    location /api/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
    location /uploads/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri /index.html;
    }
}
